<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>検査音声ガイド</title>
<style>
  :root {
    --bg: #eef2f7;
    --card: #ffffff;
    --accent: #1a6fb0;
    --accent-dark: #12507f;
    --text: #222;
    --sub: #667;
    --warn: #b04a1a;
    --ok: #1a8f4a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .screen { display: none; max-width: 560px; margin: 0 auto; padding: 12px 12px 40px; }
  .screen.active { display: block; }

  header.app-header {
    background: var(--accent);
    color: #fff;
    padding: 14px 16px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
  }
  header.app-header small { display: block; font-weight: normal; font-size: 12px; opacity: .85; margin-top: 2px; }

  h2.section { font-size: 15px; color: var(--sub); margin: 18px 4px 8px; }

  /* ---------- 設定画面 ---------- */
  .lang-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .lang-btn {
    background: var(--card);
    border: 2px solid #ccd5e0;
    border-radius: 10px;
    padding: 10px 4px;
    text-align: center;
    font-size: 14px;
    cursor: pointer;
    line-height: 1.3;
  }
  .lang-btn .native { display: block; font-size: 12px; color: var(--sub); margin-top: 2px; }
  .lang-btn.selected { border-color: var(--accent); background: #e3f0fa; font-weight: bold; }
  .lang-btn .voice-mark { display: block; font-size: 10px; margin-top: 3px; }
  .voice-ok { color: var(--ok); }
  .voice-ng { color: var(--warn); }

  .exam-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .exam-btn {
    background: var(--card);
    border: 2px solid #ccd5e0;
    border-radius: 10px;
    padding: 16px 8px;
    text-align: center;
    font-size: 15px;
    cursor: pointer;
  }
  .exam-btn.selected { border-color: var(--accent); background: #e3f0fa; font-weight: bold; }
  .exam-btn.disabled { opacity: .45; pointer-events: none; }
  .exam-btn small { display: block; font-size: 11px; color: var(--sub); margin-top: 3px; }

  .start-btn {
    display: block;
    width: 100%;
    margin-top: 24px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
  }
  .start-btn:disabled { background: #aab8c6; }

  .voice-warning {
    margin-top: 14px;
    background: #fdeee4;
    border: 1px solid var(--warn);
    color: var(--warn);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.5;
    display: none;
  }

  /* ---------- フレーズ画面 ---------- */
  .talk-header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
  }
  .talk-header .back {
    background: rgba(255,255,255,.18);
    border: none;
    color: #fff;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    cursor: pointer;
  }
  .talk-header .info { flex: 1; min-width: 0; }
  .talk-header .info .exam { font-weight: bold; font-size: 15px; }
  .talk-header .info .lang { font-size: 12px; opacity: .9; }

  .phrase-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    max-width: 560px;
    margin: 12px auto 0;
    padding: 0 12px;
  }
  .phrase-btn {
    background: var(--card);
    border: 2px solid #d5dde6;
    border-radius: 14px;
    padding: 12px 10px 14px;
    cursor: pointer;
    text-align: left;
    position: relative;
    min-height: 108px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .phrase-btn .num {
    position: absolute;
    top: 8px; right: 10px;
    font-size: 11px;
    color: #9aa8b6;
    font-weight: bold;
  }
  .phrase-btn .icon { font-size: 26px; line-height: 1; }
  .phrase-btn .jp { font-size: 14px; font-weight: bold; margin-top: 6px; line-height: 1.4; }
  .phrase-btn .tr { font-size: 11px; color: var(--sub); margin-top: 5px; line-height: 1.4; word-break: break-word; }
  .phrase-btn.speaking {
    border-color: var(--accent);
    background: #e3f0fa;
    box-shadow: 0 0 0 3px rgba(26,111,176,.25);
  }

  .control-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    border-top: 1px solid #d5dde6;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  .control-inner { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
  .ctl-btn {
    flex: 1;
    border: 2px solid var(--accent);
    background: #fff;
    color: var(--accent);
    border-radius: 10px;
    padding: 12px 4px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }
  .ctl-btn.stop { border-color: var(--warn); color: var(--warn); }
  .rate-wrap { flex: 1.2; font-size: 11px; color: var(--sub); text-align: center; }
  .rate-wrap input { width: 100%; }

  .phrase-area { padding-bottom: 96px; }

  .talk-header .big-toggle {
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.5);
    color: #fff;
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 12px;
    line-height: 1.2;
    cursor: pointer;
    white-space: nowrap;
  }
  .talk-header .big-toggle.on { background: #fff; color: var(--accent); font-weight: bold; }

  .phrase-btn .q-badge {
    display: inline-block;
    font-size: 10px;
    background: #fff4d6;
    color: #8a5a00;
    border: 1px solid #e6c56b;
    border-radius: 6px;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .phrase-btn .answer {
    display: none;
    margin-top: 6px;
    font-size: 12px;
    font-weight: bold;
    border-radius: 6px;
    padding: 3px 6px;
  }
  .phrase-btn .answer.show { display: inline-block; }
  .answer.yes, .pv-result.yes { background: #e2f5e9; color: var(--ok); }
  .answer.no, .pv-result.no { background: #fbe6e1; color: #c0392b; }
  .answer.unknown, .pv-result.unknown { background: #eceff3; color: #556; }

  /* ---------- 患者さんに見せる画面 ---------- */
  .pv {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: #fff;
    display: none;
    flex-direction: column;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  .pv.show { display: flex; }
  .pv-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .pv-top .pv-num { font-size: 13px; color: var(--sub); }
  .pv-top button {
    border: 2px solid #ccd5e0;
    background: #fff;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 14px;
    cursor: pointer;
  }
  .pv-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 14px;
    padding: 12px 0;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .pv-icon { font-size: 64px; line-height: 1; }
  .pv-text {
    font-size: clamp(26px, 7.5vw, 48px);
    font-weight: bold;
    line-height: 1.5;
    color: #111;
    word-break: break-word;
  }
  .pv-text.long { font-size: clamp(22px, 6vw, 40px); }
  .pv-jp { font-size: 14px; color: var(--sub); line-height: 1.5; }
  .pv-prompt { font-size: clamp(16px, 4.5vw, 22px); color: var(--accent-dark); font-weight: bold; margin-top: 4px; }
  .pv-answers { display: none; width: 100%; flex-direction: column; gap: 12px; }
  .pv-answers.show { display: flex; }
  .pv-ans {
    width: 100%;
    border: none;
    border-radius: 16px;
    padding: 18px 12px;
    font-size: clamp(24px, 7vw, 36px);
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    line-height: 1.3;
  }
  .pv-ans small { display: block; font-size: 13px; font-weight: normal; opacity: .9; margin-top: 2px; }
  .pv-ans.yes { background: #1a8f4a; }
  .pv-ans.no { background: #c0392b; }
  .pv-ans.unknown { background: #7a8794; font-size: clamp(20px, 5.5vw, 28px); }
  .pv-result {
    display: none;
    width: 100%;
    border-radius: 16px;
    padding: 18px 12px;
    text-align: center;
  }
  .pv-result.show { display: block; }
  .pv-result .label { font-size: 14px; }
  .pv-result .jp-ans { font-size: 44px; font-weight: bold; line-height: 1.3; }
  .pv-result .tr-ans { font-size: 16px; }
  .pv-result button {
    margin-top: 12px;
    border: 2px solid currentColor;
    background: #fff;
    color: inherit;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- ================= 画面1：設定 ================= -->
<div id="screen-setup" class="screen active">
  <header class="app-header">検査音声ガイド<small>言語と検査を選んでください</small></header>

  <h2 class="section">言語 / Language</h2>
  <div class="lang-grid" id="langGrid"></div>

  <div class="voice-warning" id="voiceWarning"></div>

  <h2 class="section">検査の種類</h2>
  <div class="exam-grid" id="examGrid"></div>

  <button class="start-btn" id="startBtn" disabled>開始する</button>
</div>

<!-- ================= 画面2：フレーズ ================= -->
<div id="screen-talk" class="screen">
  <div class="talk-header">
    <button class="back" id="backBtn">◀ 戻る</button>
    <div class="info">
      <div class="exam" id="hdrExam"></div>
      <div class="lang" id="hdrLang"></div>
    </div>
    <button class="big-toggle" id="bigToggle">患者さんに見せる<br>画面：ON</button>
  </div>

  <div class="phrase-area">
    <div class="phrase-grid" id="phraseGrid"></div>
  </div>

  <div class="control-bar">
    <div class="control-inner">
      <button class="ctl-btn" id="repeatBtn">↺ もう一度</button>
      <button class="ctl-btn stop" id="stopBtn">■ 停止</button>
      <div class="rate-wrap">
        速さ <span id="rateVal">0.9</span>
        <input type="range" id="rateSlider" min="0.5" max="1.3" step="0.1" value="0.9">
      </div>
    </div>
  </div>
</div>

<!-- ================= 患者さんに見せる画面 ================= -->
<div class="pv" id="patientView">
  <div class="pv-top">
    <span class="pv-num" id="pvNum"></span>
    <div>
      <button id="pvReplay">🔊 もう一度</button>
      <button id="pvClose">✕ 閉じる</button>
    </div>
  </div>
  <div class="pv-body">
    <div class="pv-icon" id="pvIcon"></div>
    <div class="pv-text" id="pvText"></div>
    <div class="pv-jp" id="pvJp"></div>
    <div class="pv-answers" id="pvAnswers">
      <div class="pv-prompt" id="pvPrompt"></div>
      <button class="pv-ans yes" data-ans="yes"></button>
      <button class="pv-ans no" data-ans="no"></button>
      <button class="pv-ans unknown" data-ans="unknown"></button>
    </div>
    <div class="pv-result" id="pvResult">
      <div class="label">患者さんの回答</div>
      <div class="jp-ans" id="pvResultJp"></div>
      <div class="tr-ans" id="pvResultTr"></div>
      <button id="pvRetry">答え直してもらう</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 言語定義
//  voiceLangs: 音声合成エンジンの言語コード候補（先頭から順に探す）
// ============================================================
const LANGUAGES = [

  { id: "zh", label: "北京語",         native: "普通话",            voiceLangs: ["zh-CN", "cmn-Hans-CN", "zh"] },

// ============================================================

const ANSWER_TEXT = {
  en:  { prompt: "Please tap your answer.",            yes: "Yes",          no: "No",        unknown: "I don't know" },

  hi:  { prompt: "कृपया अपना उत्तर दबाएँ।",               yes: "हाँ",           no: "नहीं",       unknown: "पता नहीं" },

const ANSWER_JP = { yes: "はい", no: "いいえ", unknown: "わからない" };

// ============================================================

// ============================================================
// 状態
// ============================================================
let selectedLang = null;
let selectedExam = null;
let lastUtteranceInfo = null;   // {text, voiceLang} 「もう一度」用
let voices = [];
let bigView = loadBigView();
let pvPhrase = null;            // 患者さんに見せる画面に表示中のフレーズ
let pvIndex = -1;

function loadBigView() {
  try { return localStorage.getItem("rvg-bigView") !== "off"; } catch (e) { return true; }
}
function saveBigView() {
  try { localStorage.setItem("rvg-bigView", bigView ? "on" : "off"); } catch (e) {}
}

// ============================================================
// 音声合成
// ============================================================
function refreshVoices() {
  voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  renderLangGrid();
  updateVoiceWarning();
}

function findVoice(lang) {
  for (const code of lang.voiceLangs) {
    const lower = code.toLowerCase();
    // 完全一致 → 前方一致 の順で探す
    let v = voices.find(v => v.lang.toLowerCase().replace("_", "-") === lower);
    if (v) return v;
    v = voices.find(v => v.lang.toLowerCase().replace("_", "-").startsWith(lower));
    if (v) return v;
  }
  return null;
}

function speak(text, lang) {
  if (!window.speechSynthesis) {
    alert("この端末は音声合成に対応していません。");
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const voice = findVoice(lang);
  if (voice) {
    u.voice = voice;
    u.lang = voice.lang;
  } else {
    u.lang = lang.voiceLangs[0];
  }
  u.rate = parseFloat(document.getElementById("rateSlider").value);
  u.onend = u.onerror = () => clearSpeakingHighlight();
  lastUtteranceInfo = { text, lang };
  speechSynthesis.speak(u);
}

function clearSpeakingHighlight() {
  document.querySelectorAll(".phrase-btn.speaking").forEach(b => b.classList.remove("speaking"));
}

// ============================================================
// 画面1：言語・検査選択
// ============================================================
function renderLangGrid() {
  const grid = document.getElementById("langGrid");
  grid.innerHTML = "";
  LANGUAGES.forEach(lang => {
    const btn = document.createElement("div");
    btn.className = "lang-btn" + (selectedLang === lang ? " selected" : "");
    const hasVoice = voices.length ? !!findVoice(lang) : null;
    const mark = hasVoice === null ? "" :
      hasVoice ? '<span class="voice-mark voice-ok">♪ 音声あり</span>'
               : '<span class="voice-mark voice-ng">音声なし</span>';
    btn.innerHTML = `${lang.label}<span class="native">${lang.native}</span>${mark}`;
    btn.onclick = () => {
      selectedLang = lang;
      renderLangGrid();
      updateVoiceWarning();
      updateStartBtn();
      // 選択時に試し発声（音声確認を兼ねる）
      const sample = EXAMS[0].phrases[7].t[lang.id];
      if (findVoice(lang)) speak(sample, lang);
    };
    grid.appendChild(btn);
  });
}

function renderExamGrid() {
  const grid = document.getElementById("examGrid");
  grid.innerHTML = "";
  EXAMS.forEach(exam => {
    const btn = document.createElement("div");
    btn.className = "exam-btn" + (selectedExam === exam ? " selected" : "") + (exam.ready ? "" : " disabled");
    btn.innerHTML = exam.name + (exam.ready ? "" : "<small>準備中</small>");
    btn.onclick = () => {
      selectedExam = exam;
      renderExamGrid();
      updateStartBtn();
    };
    grid.appendChild(btn);
  });
}

function updateVoiceWarning() {
  const w = document.getElementById("voiceWarning");
  if (selectedLang && voices.length && !findVoice(selectedLang)) {
    w.style.display = "block";
    w.textContent = `⚠ この端末に「${selectedLang.label}」の音声データが見つかりません。` +
      `Androidの場合：設定 → システム → 言語と入力 → テキスト読み上げ → Google音声サービスで音声データを追加してください。` +
      `代替エンジン（Google翻訳アプリの音声等）が使われる場合もあるため、まずタップして音が出るか確認してください。`;
  } else {
    w.style.display = "none";
  }
}

function updateStartBtn() {
  document.getElementById("startBtn").disabled = !(selectedLang && selectedExam);
}

// ============================================================
// 画面2：フレーズ
// ============================================================
function renderPhraseScreen() {
  document.getElementById("hdrExam").textContent = selectedExam.name;
  document.getElementById("hdrLang").textContent = `${selectedLang.label}（${selectedLang.native}）`;
  const grid = document.getElementById("phraseGrid");
  grid.innerHTML = "";
  selectedExam.phrases.forEach((p, i) => {
    const btn = document.createElement("div");
    btn.className = "phrase-btn";
    const tr = p.t[selectedLang.id] || "";
    btn.innerHTML =
      `<span class="num">${i + 1}</span>` +
      `<span class="icon">${p.icon}</span>` +
      (p.question ? `<span class="q-badge">回答あり</span>` : "") +
      `<div class="jp">${p.jp}</div>` +
      `<div class="tr">${tr}</div>` +
      (p.question ? `<div class="answer" id="answer-${i}"></div>` : "");
    btn.onclick = () => {
      clearSpeakingHighlight();
      btn.classList.add("speaking");
      speak(tr, selectedLang);
      if (bigView || p.question) openPatientView(p, i);
    };
    grid.appendChild(btn);
  });
  updateBigToggle();
}

function updateBigToggle() {
  const t = document.getElementById("bigToggle");
  t.innerHTML = `患者さんに見せる<br>画面：${bigView ? "ON" : "OFF"}`;
  t.classList.toggle("on", bigView);
}

// ============================================================
// 患者さんに見せる画面
// ============================================================
function openPatientView(p, i) {
  pvPhrase = p;
  pvIndex = i;
  const tr = p.t[selectedLang.id] || "";
  const textEl = document.getElementById("pvText");
  document.getElementById("pvNum").textContent = `${i + 1} / ${selectedExam.phrases.length}`;
  document.getElementById("pvIcon").textContent = p.icon;
  textEl.textContent = tr;
  textEl.lang = selectedLang.voiceLangs[0];
  textEl.classList.toggle("long", tr.length > 60);
  document.getElementById("pvJp").textContent = p.jp;

  const answers = document.getElementById("pvAnswers");
  const result = document.getElementById("pvResult");
  result.className = "pv-result";
  if (p.question) {
    const a = ANSWER_TEXT[selectedLang.id];
    document.getElementById("pvPrompt").textContent = a.prompt;
    answers.querySelectorAll(".pv-ans").forEach(b => {
      const key = b.dataset.ans;
      b.innerHTML = `${a[key]}<small>${ANSWER_JP[key]}</small>`;
    });
    answers.classList.add("show");
  } else {
    answers.classList.remove("show");
  }
  document.getElementById("patientView").classList.add("show");
}

function closePatientView() {
  document.getElementById("patientView").classList.remove("show");
  pvPhrase = null;
}

function recordAnswer(key) {
  const a = ANSWER_TEXT[selectedLang.id];
  document.getElementById("pvAnswers").classList.remove("show");
  const result = document.getElementById("pvResult");
  result.className = `pv-result show ${key}`;
  document.getElementById("pvResultJp").textContent = ANSWER_JP[key];
  document.getElementById("pvResultTr").textContent = a[key];

  const badge = document.getElementById(`answer-${pvIndex}`);
  if (badge) {
    const now = new Date();
    const hm = `${now.getHours()}:${String(now.getMinutes()).padStart(2, "0")}`;
    badge.textContent = `回答：${ANSWER_JP[key]}（${hm}）`;
    badge.className = `answer show ${key}`;
  }
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0, 0);
}

// ============================================================
// イベント
// ============================================================
document.getElementById("startBtn").onclick = () => {
  renderPhraseScreen();
  showScreen("screen-talk");
};
document.getElementById("backBtn").onclick = () => {
  speechSynthesis.cancel();
  closePatientView();
  showScreen("screen-setup");
};
document.getElementById("repeatBtn").onclick = () => {
  if (lastUtteranceInfo) speak(lastUtteranceInfo.text, lastUtteranceInfo.lang);
};
document.getElementById("stopBtn").onclick = () => {
  speechSynthesis.cancel();
  clearSpeakingHighlight();
};
document.getElementById("bigToggle").onclick = () => {
  bigView = !bigView;
  saveBigView();
  updateBigToggle();
};
document.getElementById("pvClose").onclick = () => {
  speechSynthesis.cancel();
  clearSpeakingHighlight();
  closePatientView();
};
document.getElementById("pvReplay").onclick = () => {
  if (pvPhrase) speak(pvPhrase.t[selectedLang.id] || "", selectedLang);
};
document.querySelectorAll(".pv-ans").forEach(b => {
  b.onclick = () => recordAnswer(b.dataset.ans);
});
document.getElementById("pvRetry").onclick = () => {
  if (pvPhrase) openPatientView(pvPhrase, pvIndex);
};
document.getElementById("rateSlider").oninput = e => {
  document.getElementById("rateVal").textContent = e.target.value;
};

// 初期化
renderExamGrid();
refreshVoices();
if (window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = refreshVoices;
}
</script>
